server {
  listen 8080;
  server_name _;
  client_max_body_size 25m;

  root /usr/share/nginx/html;
  index index.html;

  location = /health {
    access_log off;
    return 200 'ok\n';
    add_header Content-Type text/plain;
  }

  location /api/ {
    proxy_pass http://pal:3000/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location = /stream {
    proxy_pass http://pal:3000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location ~ ^/(chat|tasks|files|preferences|mcp|notifications)(/|$) {
    proxy_pass http://pal:3000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location = /desktop {
    return 308 /desktop/;
  }

  location /desktop/ {
    rewrite ^/desktop/(?:v[0-9]+/)?(.*)$ /$1 break;
    proxy_pass http://pal:6080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
    proxy_buffering off;
    add_header Cache-Control no-cache;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
