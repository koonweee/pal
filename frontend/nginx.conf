resolver 127.0.0.11 valid=5s ipv6=off;
upstream pal_api {
  zone pal_api 64k;
  server agent-service:3000 resolve;
}
upstream pal_desktop {
  zone pal_desktop 64k;
  server execution:6080 resolve;
}
upstream pal_cdp {
  zone pal_cdp 64k;
  server execution:9223 resolve;
}

server {
  listen 8080;
  server_name _;
  include /etc/nginx/execution-deny.conf;
  client_max_body_size 25m;

  root /usr/share/nginx/html;
  index index.html;

  location = /health {
    access_log off;
    return 200 'ok\n';
    add_header Content-Type text/plain;
  }

  location /api/ {
    proxy_pass http://pal_api/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location = /stream {
    proxy_pass http://pal_api;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location ~ ^/(chat|tasks|files|instance-settings|preferences|mcp|notifications)(/|$) {
    proxy_pass http://pal_api;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location = /desktop {
    return 308 /desktop/;
  }

  location /desktop/ {
    rewrite ^/desktop/(?:v[0-9]+/)?(.*)$ /$1 break;
    proxy_pass http://pal_desktop;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
    proxy_buffering off;
    add_header Cache-Control no-cache;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location = /apple-touch-icon.png {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  location = /apple-touch-icon-precomposed.png {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# Private CDP forwarding exposes only the execution browser.
server {
  listen 8081;
  location / {
    proxy_pass http://pal_cdp;
    proxy_http_version 1.1;
    proxy_set_header Host "127.0.0.1:9222";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
  }
}
