<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pal" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      if (
        matchMedia('(display-mode: standalone)').matches ||
        navigator.standalone === true
      )
        document.documentElement.classList.add('pal-standalone');
      try {
        const theme = localStorage.getItem('pal-theme');
        const dark =
          theme === 'dark' ||
          (theme !== 'light' &&
            matchMedia('(prefers-color-scheme: dark)').matches);
        const resolved = dark ? 'dark' : 'light';
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
        document.documentElement.style.setProperty(
          '--pal-app',
          dark ? '#000000' : '#ffffff',
        );
        const appearance = JSON.parse(
          localStorage.getItem('pal-instance-appearance-v1') ?? 'null',
        );
        if (
          appearance?.schema === 1 &&
          /^#[0-9a-f]{6}$/i.test(appearance.accentColor)
        ) {
          document.documentElement.style.setProperty(
            '--pal-accent',
            appearance.accentColor,
          );
          document.documentElement.style.setProperty(
            '--pal-action',
            appearance.accentColor,
          );
          document.documentElement.style.setProperty(
            '--pal-focus',
            appearance.accentColor,
          );
          document.documentElement.style.setProperty(
            '--pal-user-message',
            appearance.accentColor,
          );
        }
      } catch {}
      const scheme = document.documentElement.style.colorScheme;
      const dark =
        scheme === 'dark' ||
        (!scheme && matchMedia('(prefers-color-scheme: dark)').matches);
      document.querySelector('meta[name="theme-color"]').content = dark
        ? '#000000'
        : '#ffffff';
    </script>
    <title>Pal</title>
  </head>
  <body>
    <div id="pwa-safe-area" class="pwa-safe-area" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
