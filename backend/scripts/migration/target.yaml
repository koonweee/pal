services:
  agent-service:
    env_file: !reset []
    environment:
      PAL_PUBLIC_URL: http://localhost:14081
      PAL_EXECUTION_ID: pal-migration-check-execution
  execution:
    labels:
      mastra.sandbox.id: pal-migration-check-execution
  web:
    ports: !override
      - "127.0.0.1:14081:8080"
