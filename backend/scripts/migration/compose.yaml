services:
  legacy:
    build:
      context: .
      dockerfile: Dockerfile.legacy
    image: pal-migration-legacy-fixture
    hostname: pal-legacy-fixture
    volumes:
      - legacy_data:/data
    security_opt:
      - seccomp:../../desktop/seccomp.json
    healthcheck:
      test: ["CMD", "sh", "-c", "xprop -root _NET_SUPPORTING_WM_CHECK | grep -q 'window id'"]
      interval: 1s
      timeout: 2s
      retries: 60
    init: true
    networks: [source]
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: pal
      POSTGRES_PASSWORD: pal
      POSTGRES_DB: pal
    volumes:
      - legacy_postgres:/var/lib/postgresql/data
    networks: [source]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pal -d pal"]
      interval: 1s
      timeout: 2s
      retries: 60
volumes:
  legacy_data:
  legacy_postgres:
networks:
  source:
