services:
  agent-service:
    environment:
      PAL_APP_VARIANT: dev
      PAL_PUBLIC_URL: ${PAL_DEV_PUBLIC_URL:-http://localhost:5173}
      PAL_DESKTOP_VIEWER_URL: ${PAL_DEV_PUBLIC_URL:-http://localhost:5173}/desktop/v2/vnc.html
  web:
    build:
      args:
        PAL_RELEASE_ID: development
    ports: !reset []
  pwa:
    image: nginx:1.29.2-alpine@sha256:61e01287e546aac28a3f56839c136b31f590273f3b41187a36f46f6a03bbfe22
    configs:
      - source: dev-pwa-ingress
        target: /etc/nginx/conf.d/default.conf
    ports:
      - "127.0.0.1:${PAL_DEV_PWA_PORT:-14173}:8080"
    networks: [service]
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:8080/health >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30
    init: true
    restart: unless-stopped
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15433}:5432"
  frontend:
    image: node:24.15.0-trixie-slim@sha256:291be77873bc04731968cacf82f0fcef17cee8cf200c6b6951e2bcab41560eb7
    working_dir: /opt/pal-web
    command: ['sh', '-c', 'npm ci && npm run dev -- --host 0.0.0.0']
    environment:
      PAL_BACKEND_URL: http://agent-service:3000
      PAL_DESKTOP_URL: http://web:8080/desktop
      PAL_DEV_ALLOWED_HOST: ${PAL_DEV_ALLOWED_HOST:-}
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '127.0.0.1:${PAL_DEV_FRONTEND_PORT:-5173}:5173'
    volumes:
      - ../frontend:/opt/pal-web
      - frontend_node_modules:/opt/pal-web/node_modules
    networks: [service]
    depends_on:
      agent-service:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    init: true
volumes:
  frontend_node_modules:

configs:
  dev-pwa-ingress:
    file: ./dev-pwa-ingress.conf
