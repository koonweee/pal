# XRender works with TigerVNC's virtual display and ordinary X11 desktops.
backend = "xrender";
vsync = false;
fading = false;
unredir-if-possible = false;
corner-radius = 12;
rounded-corners-exclude = [ "window_type = 'desktop'", "window_type = 'dock'", "fullscreen" ];
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.18;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-exclude = [ "window_type = 'desktop'", "window_type = 'dock'", "fullscreen" ];
