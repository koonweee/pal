[unix_http_server]
file=/tmp/pal-runtime/supervisor.sock

[supervisord]
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/pal-runtime/supervisord.pid
childlogdir=/tmp/pal-runtime

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/pal-runtime/supervisor.sock

[program:dbus]
command=dbus-daemon --session --nofork --address=unix:path=/tmp/pal-runtime/bus
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:desktop]
command=/opt/pal/desktop/session.sh
priority=20
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:viewer]
command=websockify --web=/usr/share/novnc 6080 localhost:5901
priority=20
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api]
command=/opt/pal/desktop/api.sh
priority=30
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
